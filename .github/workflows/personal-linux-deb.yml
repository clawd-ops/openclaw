name: Personal Linux deb

run-name: Linux deb ${{ inputs.tag }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact upstream OpenClaw release tag
        required: true
        type: string
      request_id:
        description: Unique identifier used by the local download script
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    # Oldest supported build base (upstream linux-app-release.yml): the binary
    # links against this glibc, so a newer runner would drop Ubuntu 22.04/Debian 12.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Validate inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*(-[1-9][0-9]*)?$ ]]
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._-]+$ ]]

      - name: Checkout exact upstream tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # Same package list as upstream linux-app-release.yml; kept whole on
      # purpose (extra build-time packages are harmless, a missing one is not).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            at-spi2-core \
            build-essential \
            curl \
            dbus-x11 \
            ffmpeg \
            file \
            gir1.2-atspi-2.0 \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good \
            gstreamer1.0-tools \
            libatk-adaptor \
            libayatana-appindicator3-dev \
            libegl1 \
            libgles2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            mesa-utils \
            patchelf \
            pciutils \
            procps \
            psmisc \
            python3-gi \
            wget \
            wmctrl \
            xauth \
            xdg-utils \
            xvfb

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline \
            --config.ignore-scripts=false \
            --config.engine-strict=false \
            --config.enable-pre-post-scripts=true \
            --config.side-effects-cache=true

      # The deb bundler needs none of the AppImage tooling (linuxdeploy,
      # GSTREAMER_PLUGINS_DIR, LDAI_RUNTIME_FILE, NO_STRIP). The deb declares
      # its GStreamer packages as apt dependencies (tauri.conf.json bundle.linux.deb.depends).
      - name: Build deb
        working-directory: apps/linux/src-tauri
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          pnpm dlx @tauri-apps/cli@2.11.4 build --bundles deb \
            --config "{\"version\":\"${version}\",\"bundle\":{\"createUpdaterArtifacts\":false,\"useLocalToolsDir\":false}}"

      - name: Verify and stage deb
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${RELEASE_TAG#v}"
          debs=(apps/linux/src-tauri/target/release/bundle/deb/*.deb)
          if [[ ${#debs[@]} -ne 1 ]]; then
            echo "Expected one deb; found ${#debs[@]}"
            exit 1
          fi
          deb="${debs[0]}"
          dpkg-deb -I "$deb"
          deb_version=$(dpkg-deb -f "$deb" Version)
          deb_package=$(dpkg-deb -f "$deb" Package)
          deb_arch=$(dpkg-deb -f "$deb" Architecture)
          if [[ "$deb_version" != "$version" ]]; then
            echo "Debian package version '${deb_version}' does not equal release version '${version}'"
            exit 1
          fi
          if [[ ! "$deb_package" =~ ^[a-z0-9][a-z0-9.+-]*$ ]]; then
            echo "Unexpected Debian package name '${deb_package}'"
            exit 1
          fi
          if [[ "$deb_arch" != "amd64" ]]; then
            echo "Unexpected Debian architecture '${deb_arch}'"
            exit 1
          fi
          mkdir -p dist/linux-app/release
          name="OpenClaw-${version}-amd64.deb"
          cp "$deb" "dist/linux-app/release/${name}"
          (cd dist/linux-app/release && sha256sum "$name" > SHA256SUMS.linux-deb.txt)

      - name: Upload deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-linux-deb-${{ inputs.tag }}-${{ inputs.request_id }}
          path: dist/linux-app/release/*
          if-no-files-found: error
          retention-days: 14
