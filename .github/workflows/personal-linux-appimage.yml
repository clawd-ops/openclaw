name: Personal Linux AppImage

run-name: Linux AppImage ${{ inputs.tag }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact upstream OpenClaw release tag
        required: true
        type: string
      request_id:
        description: Unique identifier used by the local download script
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    # Oldest supported build base (upstream linux-app-release.yml): bundles link
    # against this glibc, so a newer runner would drop Ubuntu 22.04/Debian 12.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Validate inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*(-[1-9][0-9]*)?$ ]]
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._-]+$ ]]

      - name: Checkout exact upstream tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            at-spi2-core \
            build-essential \
            curl \
            dbus-x11 \
            ffmpeg \
            file \
            gir1.2-atspi-2.0 \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good \
            gstreamer1.0-tools \
            libatk-adaptor \
            libayatana-appindicator3-dev \
            libegl1 \
            libgles2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            mesa-utils \
            patchelf \
            pciutils \
            procps \
            psmisc \
            python3-gi \
            wget \
            wmctrl \
            xauth \
            xdg-utils \
            xvfb

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline \
            --config.ignore-scripts=false \
            --config.engine-strict=false \
            --config.enable-pre-post-scripts=true \
            --config.side-effects-cache=true

      - name: Stage AppImage GStreamer plugins
        shell: bash
        run: |
          set -euo pipefail
          plugins="${RUNNER_TEMP}/openclaw-gstreamer-plugins"
          apps/linux/scripts/stage-appimage-gstreamer.sh "$plugins" \
            | tee "${RUNNER_TEMP}/openclaw-gstreamer-elements.tsv"
          echo "GSTREAMER_PLUGINS_DIR=$plugins" >> "$GITHUB_ENV"

      - name: Prepare pinned AppImage tools
        shell: bash
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/openclaw-tauri-cache
        run: |
          set -euo pipefail
          apps/linux/scripts/tauri-appimage-tools.sh prepare
          apps/linux/scripts/tauri-appimage-tools.sh verify pre-build
          runtime_file=$(apps/linux/scripts/tauri-appimage-tools.sh runtime-path)
          echo "LDAI_RUNTIME_FILE=$runtime_file" >> "$GITHUB_ENV"

      - name: Build AppImage
        working-directory: apps/linux/src-tauri
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          # appimagetool strips fail on CI runners; Tauri documents NO_STRIP for Actions.
          NO_STRIP: "true"
          XDG_CACHE_HOME: ${{ runner.temp }}/openclaw-tauri-cache
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          pnpm dlx @tauri-apps/cli@2.11.4 build --bundles appimage \
            --config "{\"version\":\"${version}\",\"bundle\":{\"createUpdaterArtifacts\":false,\"useLocalToolsDir\":false}}"

      - name: Finalize AppImage
        shell: bash
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/openclaw-tauri-cache
        run: |
          set -euo pipefail
          apps/linux/scripts/finalize-appimage.sh apps/linux/src-tauri/target/release/bundle/appimage

      - name: Stage and verify AppImage
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${RELEASE_TAG#v}"
          appimages=(apps/linux/src-tauri/target/release/bundle/appimage/*.AppImage)
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "Expected one AppImage; found ${#appimages[@]}"
            exit 1
          fi
          if [[ "$(basename "${appimages[0]}")" != *"${version}"* ]]; then
            echo "AppImage name '$(basename "${appimages[0]}")' does not contain version '${version}'"
            exit 1
          fi
          mkdir -p dist/linux-app/release
          target="dist/linux-app/release/OpenClaw-${version}-linux-x86_64.AppImage"
          cp "${appimages[0]}" "$target"
          (cd dist/linux-app/release && sha256sum "OpenClaw-${version}-linux-x86_64.AppImage" > SHA256SUMS.linux-app.txt)

      # Mirrors upstream linux-app.yml / linux-app-release.yml "Test packaged
      # AppImage runtime" (image pinned by digest, as upstream). Runs on the exact
      # staged file that gets uploaded, so a failing AppImage is never uploaded.
      - name: Test packaged AppImage runtime
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          xvfb-run -a -s '-screen 0 1280x1024x24' dbus-run-session -- \
            /usr/bin/python3 apps/linux/tests/packaged_runtime_smoke.py \
            "dist/linux-app/release/OpenClaw-${version}-linux-x86_64.AppImage" \
            --output "${RUNNER_TEMP}/linux-packaged-runtime" \
            --require-fuse \
            --shell-container \
              "archlinux@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a"

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-linux-${{ inputs.tag }}-${{ inputs.request_id }}
          path: dist/linux-app/release/*
          if-no-files-found: error
          retention-days: 14
